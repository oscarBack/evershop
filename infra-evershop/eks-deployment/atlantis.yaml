version: 3
projects:
  - name: evershop-eks-dev
    dir: infra-evershop/eks-deployment
    workspace: dev
    terraform_version: v1.5.0
    autoplan:
      when_modified: ["*.tf", "dev.hcl"]
      enabled: true
    apply_requirements: [approved]

  - name: evershop-eks-qa
    dir: infra-evershop/eks-deployment
    workspace: qa
    terraform_version: v1.5.0
    autoplan:
      when_modified: ["*.tf", "qa.hcl"]
      enabled: true
    apply_requirements: [approved]

  - name: evershop-eks-prod
    dir: infra-evershop/eks-deployment
    workspace: prod
    terraform_version: v1.5.0
    autoplan:
      when_modified: ["*.tf", "prod.hcl"]
      enabled: true
    apply_requirements: [approved, mergeable]
